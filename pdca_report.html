a { color: #58a6ff; text-decoration: none; }

/* ── Header ── */
header { background: linear-gradient(135deg,#161b22 0%,#1f6feb22 100%); border-bottom: 1px solid #30363d; padding: 18px 28px; display: flex; align-items: center; gap: 20px; }

header .sub { color: #8b949e; font-size: 12px; }

.tr-label { color: #8b949e; font-size: 12px; margin-right: 4px; }

.tr-btn:hover { border-color: #58a6ff; color: #58a6ff; }
.tr-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }

/* ── Main Layout ── */
.wrap { display: flex; min-height: 100vh; }

/* ── Left Sidebar ── */
.sidebar { width: 200px; background: #161b22; border-right: 1px solid #30363d; padding: 16px 0; flex-shrink: 0; }
.shop-card { padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent; transition: all .15s; margin: 2px 0; }
.shop-card:hover { background: #1f2937; }
.shop-card.active { border-left-color: #1f6feb; background: #1f6feb18; }
.shop-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.shop-score { font-size: 11px; color: #8b949e; }
.score-pill { display: inline-block; width: 30px; text-align: center; border-radius: 10px; font-size: 11px; font-weight: 700; }
.pill-high { background: #238636; color: #fff; }
.pill-mid  { background: #9e6a03; color: #fff; }
.pill-low  { background: #da3633; color: #fff; }

/* ── Main Content ── */
.main { flex: 1; padding: 20px 24px; overflow-x: hidden; }

/* ── KPI Strip ── */
.kpi-strip { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; margin-bottom: 16px; }
.kpi-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px 14px; text-align: center; }
.kpi-card .v { font-size: 22px; font-weight: 700; }
.kpi-card .lbl { font-size: 11px; color: #8b949e; margin-top: 3px; }
.kpi-card .sub { font-size: 10px; color: #6e7681; margin-top: 2px; }
.kpi-card .trend { font-size: 10px; margin-top: 4px; }
.up { color: #3fb950; }
.dn { color: #f85149; }
.fl { color: #8b949e; }

.alert { padding: 8px 12px; border-radius: 7px; margin-bottom: 6px; font-size: 12px; display: flex; gap: 8px; align-items: flex-start; }
.alert-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.alert-red   { background: #f8514922; border: 1px solid #f8514933; }
.alert-red   .alert-dot { background: #f85149; }
.alert-orange{ background: #d2992222; border: 1px solid #d2992233; }
.alert-orange .alert-dot { background: #d29922; }
.alert-blue  { background: #388bfd22; border: 1px solid #388bfd33; }
.alert-blue  .alert-dot { background: #58a6ff; }

/* ── PDCA Tabs ── */
.pdca-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.pdca-tab { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 7px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .2s; }
.pdca-tab:hover { color: #e6edf3; }
.pdca-tab.active { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }

/* ── PDCA Panels ── */
.pdca-panel { display: none; }
.pdca-panel.active { display: block; }

/* ── Grid Layouts ── */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* ── Cards ── */
.card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.card-title { font-size: 13px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

/* ── KPI Squares ── */
.kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.kpi-box { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px; text-align: center; }
.kpi-box .val { font-size: 18px; font-weight: 700; }

.kpi-box.warn { border-color: #d29922; background: #d2992210; }

.kpi-box.good  { border-color: #238636; background: #23863610; }

.bar-label { font-size: 11px; color: #8b949e; margin-bottom: 3px; display: flex; justify-content: space-between; }
.bar-track { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }

/* ── Action Cards ── */

.progress-track { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; }

.dead-pct { width: 40px; text-align: right; color: #f85149; flex-shrink: 0; }

  s += d.dead_pct <= 30 ? 25 : d.dead_pct <= 50 ? 18 : d.dead_pct <= 65 ? 10 : 3;
  // VIP运营 25分
  s += d.vip_rate >= 18 ? 25 : d.vip_rate >= 12 ? 18 : d.vip_rate >= 8 ? 10 : 3;
  // 售罄率 25分
  s += d.sell7_rate >= 55 ? 25 : d.sell7_rate >= 40 ? 18 : d.sell7_rate >= 25 ? 10 : 3;
  return Math.round(s);
}

function drawRadar() {
  const canvas = document.getElementById('radarCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2-10, r=80;
  ctx.clearRect(0,0,W,H);

  // Axes + grids
  const axes = ['GMV强度','库存周转','VIP复购','售罄率'];
  const shops = Object.keys(DATA);
  const colors = ['#58a6ff','#3fb950','#d29922','#f85149'];
  const n = axes.length;

  for(let ring=1;ring<=4;ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const a = (i*2*Math.PI/n) - Math.PI/2;
      const rr = r*(ring/4);
      ctx.lineTo(cx+rr*Math.cos(a), cy+rr*Math.sin(a));
    }
    ctx.closePath();
    ctx.strokeStyle='#30363d'; ctx.lineWidth=.5; ctx.stroke();
  }
  for(let i=0;i<n;i++){
    const a = (i*2*Math.PI/n) - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(cx,cy); ctx.lineTo(cx+r*Math.cos(a), cy+r*Math.sin(a));
    ctx.strokeStyle='#30363d'; ctx.lineWidth=.5; ctx.stroke();
    ctx.fillStyle='#8b949e'; ctx.font='10px sans-serif';
    ctx.textAlign='center';
    const tx=cx+(r+18)*Math.cos(a), ty=cy+(r+18)*Math.sin(a);
    ctx.fillText(axes[i],tx,ty+3);
  }

  // Shop polygons
  shops.forEach((code,ci)=>{
    const d = DATA[code].ranges[curRange];
    const max = { gmv:200000, turns:60, vip:400, sell:100 };
    const vals = [d.gmv/max.gmv, d.turns/max.turns, d.vip/max.vip, d.sell7_rate/max.sell];
    ctx.beginPath();
    vals.forEach((v,i)=>{
      const a=(i*2*Math.PI/n)-Math.PI/2;
      const rr=Math.min(v,1)*r;
      if(i===0) ctx.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));
      else ctx.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));
    });
    ctx.closePath();
    ctx.strokeStyle=colors[ci]; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle=colors[ci]+'33'; ctx.fill();
  });

  // Legend
  shops.forEach((code,ci)=>{
    ctx.fillStyle=colors[ci];
    ctx.fillRect(8, H-18+ci*14, 8, 8);
    ctx.fillStyle='#8b949e'; ctx.font='10px sans-serif';
    ctx.textAlign='left';
    ctx.fillText(DATA[code].short, 20, H-11+ci*14);
  });
}

function buildCompareTable() {

  const best = k => {
    const vals = keys.map(c=>DATA[c].ranges[curRange][k]).filter(v=>v!=null);
    return Math.max(...vals);
  };
  const gmvBest = best('gmv');
  const deadBest = best('dead_pct');
  const vipBest = best('vip_rate');
  const sellBest = best('sell7_rate');

  let html = `<div class="card-title">📊 横向指标对比 · ${RANGES[curRange].label}</div>
  <table class="std-table"><thead><tr><th>指标</th>`;
  keys.forEach(c=>html+=`<th>${DATA[c].short}</th>`);
  html+=`</tr></thead><tbody>`;

  const rows = [
    ['GMV（元）','gmv',fmt,'up'],
    ['订单数','orders',n=>n,'up'],
    ['AOV','aov',fmt,'up'],
    ['死库率','dead_pct',v=>v?'<span class="cb">'+v.toFixed(1)+'%</span>':'—','dn'],
    ['周转天数','turns',f2,'up'],
    ['VIP订单占比','vip_rate',v=>v?f2(v)+'%':'—','up'],
    ['VIP复购率','vip_rp_rate',v=>v?f2(v)+'%':'—','up'],
    ['7天售罄率','sell7_rate',v=>v?f2(v)+'%':'—','up'],
    ['30天售罄率','sell30_rate',v=>v?f2(v)+'%':'—','up'],
    ['综合评分','score',(v,c)=>`<span class="score-pill ${scoreClass(v)}">${v}</span>`,'up'],
  ];
  rows.forEach(([lbl,k,fn])=>{
    html+=`<tr><td>${lbl}</td>`;
    keys.forEach(c=>{
      const v = DATA[c].ranges[curRange][k];
      if(k==='score'){
        html+=`<td style="text-align:center">${fn(v,c)}</td>`;
      } else {
        const bv = k==='dead_pct' ? best('dead_pct') : best(k);
        const isBest = v!=null && (k==='dead_pct' ? v<=bv : v>=bv);
        const cls = k==='dead_pct' ? (v>65?'cb':v>40?'cm':'ck') : (k==='turns'? (v>40?'cb':v>25?'cm':'ck') : '');
        html+=`<td class="${cls}" style="text-align:right">${isBest?'<b>★ </b>':''}${fn(v,c)}</td>`;
      }
    });
    html+=`</tr>`;
  });
  html+=`</tbody></table>`;
  card.innerHTML = html;
  return card;
}

          ${d.dead_pct>65?'⚠️ 超过安全线，需紧急清仓策略':'死库率可控，建议持续监控'}<br>
          活跃件 ${d.inv_qty-d.dead_qty} / 总件 ${d.inv_qty}
        </div>
      </div>
    </div>`;
  return card;
}

// ═══════════════════════════════════════════════
// DO TAB
// ═══════════════════════════════════════════════
function buildDo(d, score) {
  const p = document.createElement('div');
  p.className = 'pdca-panel';

  const card = document.createElement('div');
  card.className='card';

  const actions = [];
  if(d.dead_pct > 65) {
    actions.push({p:'P1', priority:'badge-p1', cls:'action-card p1',
      title:'死库紧急清仓行动',
      meta:[{l:'责任人',v:'店长'},{l:'截止',v:'5月5日'},{l:'交付',v:'清仓方案+执行进度'}],
      desc:`死库率${d.dead_pct.toFixed(1)}%严重超标。立即启动折扣专区，对60天零动销款执行7折出清，陈列到入口区域，目标是两周内死库率降至50%以下。每日晒库存截图至店长群。`});
  }
  if(d.gmv < d.gmv_last) {
    actions.push({p:'P1', priority:'badge-p1', cls:'action-card p1',
      title:'GMV下滑根因诊断',
      meta:[{l:'责任人',v:'店长+运营'},{l:'截止',v:'5月2日'},{l:'交付',v:'分析报告+对策'}],
      desc:`GMV同比下滑${(((d.gmv-d.gmv_last)/d.gmv_last)*100).toFixed(1)}%。需拆解到：客流/进店率/试穿率/成交率四个环节，对比去年同期找断崖节点。重点排查TOP款是否缺货或主推款折扣收早了。`});
  }
  if(d.vip_rate < 10) {
    actions.push({p:'P2', priority:'badge-p2', cls:'action-card p2',
      title:'VIP激活专项',
      meta:[{l:'责任人',v:'VIP运营'},{l:'截止',v:'5月10日'},{l:'交付',v:'VIP名单+激活话术+回访记录'}],
      desc:`VIP订单占比${d.vip_rate.toFixed(1)}%偏低。导出近90天未复购VIP名单，按累计消费分层（500+/1000+/2000+），匹配不同激活策略：满减券/新品优先购/专属折扣。`});
  }
  if(d.sell7_rate < 40) {
    actions.push({p:'P2', priority:'badge-p2', cls:'action-card p2',
      title:'售罄率提升计划',
      meta:[{l:'责任人',v:'陈列+导购'},{l:'截止',v:'5月8日'},{l:'交付',v:'主推款陈列图+话术手册'}],
      desc:`7天售罄率${d.sell7_rate.toFixed(1)}%低于健康线40%。将TOP20款前排+中岛+入口高频区域陈列，每周调整一次。导购主推话术：FAB法则（特点-优势-好处），配合限时优惠收单。`});
  }
  if(d.turns > 50) {
    actions.push({p:'P2', priority:'badge-p2', cls:'action-card p2',
      title:'库存结构优化',
      meta:[{l:'责任人',v:'店长'},{l:'截止',v:'5月15日'},{l:'交付',v:'SKU梳理报告+调拨申请'}],
      desc:`周转天数${d.turns.toFixed(0)}天偏慢。与相邻门店（${nearbyShop(curShop)}）发起调拨，优先调拨同款不同色的滞销SKU。同时与区域督导沟通减少下次期货铺货量。`});
  }
  if(score < 40) {
    actions.push({p:'P3', priority:'badge-p3', cls:'action-card p3',
      title:'TOP3 导购能力验证',
      meta:[{l:'责任人',v:'店长'},{l:'截止',v:'5月20日'},{l:'交付',v:'TOP10款推销追踪表'}],
      desc:`TOP3(${d.top3.slice(0,3).join('/')}) 推销能力需验证。追踪TOP10款在TOP3和非TOP3导购手下的成交率差异，目标：TOP10在TOP3手中占比提升至80%以上。`});
  } else {
    actions.push({p:'P3', priority:'badge-p3', cls:'action-card p3',
      title:'持续优化·TOP3梯队建设',
      meta:[{l:'责任人',v:'店长'},{l:'截止',v:'5月20日'},{l:'交付',v:'梯队培养计划'}],
      desc:`运营健康，保持现状同时关注梯队建设。将TOP3(${d.top3.slice(0,3).join('/')})成功话术提炼成SOP，传授给其他导购，目标将TOP3+4-5名导购GMV差距缩小至15%以内。`});
  }

  let html=`<div class="card-title">🚀 行动建议 · ${RANGES[curRange].label}</div>
    <div style="font-size:11px;color:#6e7681;margin-bottom:12px">以下行动按优先级排列，每项需在截止日前完成交付物</div>`;
  actions.forEach(a=>{
    html+=`<div class="${a.cls}">
      <div class="action-header">
        <span class="priority-badge ${a.priority}">${a.p}</span>
        <span class="action-title">${a.title}</span>
      </div>
      <div style="font-size:12px;color:#8b949e;line-height:1.6;margin-top:6px">${a.desc}</div>
      <div class="action-meta">${a.meta.map(m=>`<span><b>${m.l}：</b>${m.v}</span>`).join('')}</div>
    </div>`;
  });
  card.innerHTML=html;
  p.appendChild(card);
  return p;
}

function nearbyShop(code) {
  const map = {A748:'孝感吾悦',A056:'赤壁摩尔城',A793:'咸宁中商',A116:'蕲春大中华'};
  return map[code]||'其他门店';
}

// ═══════════════════════════════════════════════
// CHECK TAB
// ═══════════════════════════════════════════════
function buildCheck(d, score) {
  const p = document.createElement('div');
  p.className = 'pdca-panel';

  const card = document.createElement('div');
  card.className='card';

  const metrics = [
    {l:'GMV达成率', v:Math.min((d.gmv/d.gmv_last-1)*100+100,120), c:'#58a6ff', warn:90, danger:80},
    {l:'死库率降幅', v:Math.max(100-(d.dead_pct/80*100),0), c:'#3fb950', warn:50, danger:30},
    {l:'VIP转化率', v:d.vip_rate*5, c:'#d29922', warn:50, danger:30},
    {l:'7天售罄率', v:d.sell7_rate, c:'#58a6ff', warn:40, danger:25},
    {l:'30天售罄率', v:d.sell30_rate, c:'#3fb950', warn:60, danger:40},
    {l:'TOP3占比健康度', v:d.top3_pct, c:'#58a6ff', warn:65, danger:55},
  ];

  const row = (l,v,c) => `
    <div class="progress-row">
      <div class="progress-lbl"><span>${l}</span><span>${v.toFixed(1)}%</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(v,100)}%;background:${c}"></div></div>
    </div>`;

  let html=`<div class="card-title">📐 Check · 进度追踪</div>
    <div style="font-size:12px;color:#8b949e;margin-bottom:14px">下次店长会议时间：<b style="color:#e6edf3">${nextMeeting()}</b></div>
    <div style="font-size:11px;color:#6e7681;margin-bottom:12px">各项指标相对于目标的达成情况（100% = 达标）</div>`;
  metrics.forEach(m=>html+=row(m.l, m.v, m.c));

  html+=`<div style="margin-top:16px;padding:10px;background:#0d1117;border-radius:8px;font-size:12px;color:#8b949e">
    <div style="margin-bottom:6px">📅 本周期复盘问题：</div>
    <textarea style="width:100%;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:6px;font-size:12px;resize:vertical;min-height:60px" placeholder="请在此记录本周期复盘发现..."></textarea>
  </div>`;
  card.innerHTML=html;
  p.appendChild(card);
  return p;
}

function nextMeeting() {
  const now=new Date('2026-04-25');
  const day=now.getDay();
  const daysToFri=(5-day+7)%7||7;
  const fri=new Date(now); fri.setDate(now.getDate()+daysToFri);
  return `${fri.getMonth()+1}月${fri.getDate()}日（周五）`;
}

// ═══════════════════════════════════════════════
// ACT TAB
// ═══════════════════════════════════════════════
function buildAct(d, score) {
  const p = document.createElement('div');
  p.className = 'pdca-panel';

  // 执行标准表
  const stdCard = document.createElement('div');
  stdCard.className='card';
  const deadColor = d.dead_pct>65?'cb':d.dead_pct>40?'cm':'ck';
  const vipColor = d.vip_rate>=12?'ck':d.vip_rate>=8?'cm':'cb';
  const sellColor = d.sell7_rate>=40?'ck':d.sell7_rate>=25?'cm':'cb';
  stdCard.innerHTML=`<div class="card-title">📌 执行标准表 · ${DATA[curShop].name}</div>
    <table class="std-table">
      <thead><tr><th>指标</th><th>当前值</th><th>目标值</th><th>状态</th><th>升级触发</th></tr></thead>
      <tbody>
        <tr><td>死库率</td><td><b style="color:${deadColor}">${d.dead_pct.toFixed(1)}%</b></td><td>≤40%</td><td class="${deadColor}">${d.dead_pct<=40?'✅ 达标':d.dead_pct<=55?'⚠️ 预警':'🔴 超标'}</td><td>&gt;65%触发升级</td></tr>
        <tr><td>VIP订单占比</td><td><b style="color:${vipColor}">${d.vip_rate.toFixed(1)}%</b></td><td>≥12%</td><td class="${vipColor}">${d.vip_rate>=12?'✅ 达标':d.vip_rate>=8?'⚠️ 预警':'🔴 不足'}</td><td>&lt;8%触发升级</td></tr>
        <tr><td>7天售罄率</td><td><b style="color:${sellColor}">${d.sell7_rate.toFixed(1)}%</b></td><td>≥40%</td><td class="${sellColor}">${d.sell7_rate>=40?'✅ 达标':d.sell7_rate>=25?'⚠️ 预警':'🔴 偏低'}</td><td>&lt;25%触发升级</td></tr>
        <tr><td>GMV趋势</td><td>${trend(d.gmv,d.gmv_last)}</td><td>正增长</td><td class="${d.gmv>=d.gmv_last?'ck':'cb'}">${d.gmv>=d.gmv_last?'✅ 增长':'🔴 下滑'}</td><td>连续2期下滑触发</td></tr>
        <tr><td>周转天数</td><td>${d.turns.toFixed(0)}天</td><td>≤45天</td><td class="${d.turns<=45?'ck':d.turns<=55?'cm':'cb'}">${d.turns<=45?'✅ 达标':d.turns<=55?'⚠️ 偏慢':'🔴 过慢'}</td><td>&gt;60天触发升级</td></tr>
      </tbody>
    </table>`;

  // 运营日历
  const calCard = document.createElement('div');
  calCard.className='card';
  const now=new Date('2026-04-25');
  const year=now.getFullYear(), month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=now.getDate();

  // events: day -> label
  const events = {};
  if(d.dead_pct>65) {[3,10,17,24].forEach(d=>events[d]='死库跟进日'});
  if(d.vip_rate<10) {[7,14,21,28].forEach(d=>events[d]='VIP回访日'});
  [1,8,15,22,29].forEach(d=>events[d]='店长会议');
  events[5]='月度复盘';

  let calHtml=`<div class="card-title">📅 运营日历 · ${year}年${month+1}月</div>
    <div class="cal-grid">
      <div class="cal-dow">一</div><div class="cal-dow">二</div><div class="cal-dow">三</div>
      <div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div><div class="cal-dow">日</div>`;
  const shiftDay = d => d===0?6:d-1;
  const offset = shiftDay(firstDay);
  for(let i=0;i<offset;i++) calHtml+=`<div></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const ev=events[day];
    const isToday=day===today;
    calHtml+=`<div class="cal-day${ev?' event':''}${isToday?' today':''}" title="${ev||''}">${day}${ev?'<br><span style="font-size:9px">'+ev.split('')[0]+'</span>':''}</div>`;
  }
  calHtml+=`</div>`;
  calCard.innerHTML=calHtml;

  // 升级路径
  const upCard = document.createElement('div');
  upCard.className='card';
  upCard.innerHTML=`<div class="card-title">⬆️ 升级路径</div>
    <table class="std-table">
      <thead><tr><th>触发条件</th><th>升级对象</th><th>升级内容</th></tr></thead>
      <tbody>
        <tr><td>死库率 &gt;65%</td><td>→ 区域督导</td><td>申请紧急折扣授权+跨店调拨</td></tr>
        <tr><td>GMV连滑2期</td><td>→ 运营经理</td><td>分析客流结构+调整主推款</td></tr>
        <tr><td>VIP占比 &lt;8%</td><td>→ VIP运营组</td><td>启动精准召回+专属活动</td></tr>
        <tr><td>售罄率 &lt;25%</td><td>→ 陈列+培训</td><td>快闪+主推款强化训练</td></tr>
      </tbody>
    </table>`;

  p.appendChild(stdCard);
  p.appendChild(calCard);
  p.appendChild(upCard);
  return p;
}

// ═══════════════════════════════════════════════
// MASTER RENDER
// ═══════════════════════════════════════════════
function render() {
  const d = DATA[curShop].ranges[curRange];
  const score = calcScore(d, curRange);
  const main = document.getElementById('mainContent');

  main.innerHTML = '';

  // Alerts strip
  main.appendChild(shopAlerts(d, score));

  // Shop summary
  const shopSum = document.createElement('div');
  shopSum.className='shop-sum';
  const level=score>=60?'ss-good':score>=40?'ss-mid':'ss-low';
  const levelTxt=score>=60?'运营健康':score>=40?'轻度预警':'紧急干预';
  shopSum.innerHTML=`<div><div class="ss-name">${DATA[curShop].name}</div><div style="font-size:11px;color:#8b949e">${RANGES[curRange].label} · 综合评分</div></div><div><div class="ss-badge ${level}">${score} 分 · ${levelTxt}</div></div><div style="margin-left:auto;text-align:right;font-size:11px;color:#8b949e">${d.start} 至 ${d.end}</div>`;
  main.appendChild(shopSum);

  // KPI strip
  main.appendChild(shopKPIStrip(d));

  // PDCA tabs
  const tabBar = document.createElement('div');
  tabBar.className='pdca-tabs';
  ['📋 Plan','🚀 Do','📐 Check','📌 Act'].forEach((t,i)=>{
    const btn=document.createElement('button');
    btn.className='pdca-tab'+(i===0?' active':'');
    btn.textContent=t;
    btn.onclick=()=>{
      document.querySelectorAll('.pdca-tab').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.pdca-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('p'+i).classList.add('active');
    };
    tabBar.appendChild(btn);
  });
  main.appendChild(tabBar);

  // PDCA panels
  main.appendChild(buildPlan(d, score));
  main.appendChild(buildDo(d, score));
  main.appendChild(buildCheck(d, score));
  main.appendChild(buildAct(d, score));

  // Fix IDs
  const panels = main.querySelectorAll('.pdca-panel');
  panels.forEach((p,i)=>p.id='p'+i);

  // Priority matrix
  main.appendChild(buildPriorityMatrix(d));
}

// ═══════════════════════════════════════════════
// GLOBAL VIEW (range overview)
// ═══════════════════════════════════════════════
function renderGlobal() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  const title = document.createElement('div');
  title.className='section-title';
  title.textContent=`📊 四店总览 · ${RANGES[curRange].label}`;
  main.appendChild(title);

  main.appendChild(buildGlobalKPI());

  const g = document.createElement('div');
  g.className='grid2';
  g.appendChild(buildDeadBars());
  g.appendChild(buildRadar());
  main.appendChild(g);

  main.appendChild(buildCompareTable());
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
function setRange(idx, btn) {
  curRange = idx;
  document.querySelectorAll('.tr-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildSidebar();
  renderGlobal();
}

function init() {
  buildSidebar();
  renderGlobal();
}

init();
</script>
